name: Sinkronisasi video YouTube

on:
  schedule:
    # Tiap 2 jam (menit 17 agar tidak bertabrakan dengan antrean jam bulat). Jadwal GitHub bisa terlambat beberapa menit.
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Tanpa secret YOUTUBE_API_KEY, script memakai feed RSS publik channel.
      # Gagal → job merah (GitHub mengirim notifikasi) dan videos.json lama tidak berubah.
      - name: Ambil video terbaru dari channel
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/sync-youtube.mjs

      - name: Cek perubahan katalog
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- src/data/videos.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Tidak ada video baru atau perubahan."
          fi

      - name: Pastikan website tetap bisa dibuild
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm ci
          npm run build

      # Push ke main memicu deploy otomatis di hosting (Netlify/Cloudflare Pages/Vercel) yang tersambung ke repo.
      - name: Commit katalog terbaru
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/videos.json
          git commit -m "chore: sinkronisasi video YouTube"
          git push
