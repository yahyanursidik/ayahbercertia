<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ayah Bercerita — Prototype UI/UX</title><style>
:root{--forest:#28594e;--deep:#183e35;--sage:#83a998;--cream:#f5f0e5;--amber:#d7a05a;--slate:#475e70;--ink:#21352f;--muted:#66756d;--line:#dfe6de;--white:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fdfcf9;color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.container{max-width:1160px;padding:0 24px;margin:auto}.header{position:sticky;top:0;z-index:20;border-bottom:1px solid #e8eae2;background:#fffcf7ee;backdrop-filter:blur(12px)}.headinner{height:74px;display:flex;align-items:center;justify-content:space-between;gap:22px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.6px;color:var(--deep);white-space:nowrap}.brandmark{height:39px;width:39px;border-radius:12px;background:var(--forest);color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px}.nav{display:flex;align-items:center;gap:22px}.nav button{background:none;border:0;color:#4d6059;padding:7px 0;font-weight:600;font-size:13px}.nav button.active{color:var(--forest);box-shadow:0 2px var(--forest)}.primary{background:var(--forest);border:1px solid var(--forest);color:white;border-radius:11px;padding:12px 18px;font-size:14px;font-weight:700}.primary:hover{background:var(--deep)}.secondary{background:transparent;border:1px solid #aac2b4;color:var(--forest);border-radius:11px;padding:12px 18px;font-size:14px;font-weight:700}.burger{display:none;border:1px solid var(--line);background:white;border-radius:8px;padding:8px 12px}.hero{padding:76px 0 70px;background:linear-gradient(105deg,#f5f0e5,#f7f8f0)}.herogrid{display:grid;grid-template-columns:1.12fr .88fr;align-items:center;gap:64px}.eyebrow{text-transform:uppercase;letter-spacing:2px;color:var(--forest);font-size:11px;font-weight:850}h1,h2,h3{line-height:1.18;letter-spacing:-1px;margin:0;color:var(--deep)}h1{font-size:clamp(36px,5vw,62px);max-width:700px;margin:16px 0 22px}h2{font-size:clamp(27px,3vw,37px)}h3{font-size:21px}.lede{font-size:18px;color:#52655b;line-height:1.8;max-width:560px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:27px}.visual{background:#dfead9;border-radius:27px;min-height:335px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid #ceddcf}.visual:before{content:"";position:absolute;height:300px;width:300px;border-radius:50%;background:#c8d8c3;left:-75px;bottom:-130px}.visual:after{content:"";position:absolute;height:220px;width:220px;border-radius:50%;background:#f3e8c9;right:-80px;top:-80px}.illustration{position:relative;z-index:1;width:73%;max-width:310px}.section{padding:66px 0}.section.alt{background:#f8f8f3}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px;gap:14px}.sectionhead p{margin:10px 0 0;color:var(--muted);max-width:630px}.textlink{border:none;background:none;color:var(--forest);font-weight:750;white-space:nowrap}.topics{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.topic{border:1px solid #e2e9df;background:#fff;border-radius:16px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:650;color:var(--forest);text-align:center}.topic span{font-size:27px}.topic:hover{border-color:#8fae9b;background:#f7faf5}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:19px}.video-card{border:0;background:none;text-align:left;padding:0;display:block;min-width:0}.thumbnail{height:auto;aspect-ratio:9/12.5;border-radius:16px;position:relative;overflow:hidden;display:flex;justify-content:center;align-items:center;color:var(--forest);border:1px solid #dbe2d8}.thumbnail svg{width:80%;max-height:80%;filter:drop-shadow(0 5px 0 #ffffff65)}.thumbnail .play{position:absolute;bottom:12px;right:12px;background:#ffffffed;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:19px;color:var(--forest);font-weight:bold}.duration{position:absolute;left:12px;bottom:14px;background:#17362ddf;color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px}.cardtitle{font-size:16px;letter-spacing:-.2px;line-height:1.45;margin:11px 0 4px;font-weight:750;color:var(--ink)}.meta{font-size:12px;color:var(--muted)}.paths{display:grid;grid-template-columns:1fr 1fr;gap:20px}.path{background:#e7efe5;border:1px solid #d6e7d5;padding:28px;border-radius:21px;min-height:228px}.path.ayah{background:#e9edf0;border-color:#dde5eb}.path p{color:#56675f;max-width:370px}.path.ayah p{color:#516170}.path a{font-weight:800;color:var(--forest)}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.step{background:#fff;border:1px solid #e2e9df;padding:27px;border-radius:17px}.step strong{font-size:19px;color:var(--deep)}.step .num{font-size:12px;color:#a77c39;font-weight:850;letter-spacing:1px}.step p{color:var(--muted);margin-bottom:0}.footer{background:#183e35;color:#e8f2e9;padding:42px 0}.footrow{display:flex;justify-content:space-between;gap:22px;align-items:center}.footer small{color:#c9d8cf}.pagehead{padding:65px 0 30px;background:#f5f0e5}.pagehead p{color:#52655b;max-width:670px;margin-top:14px}.toolbar{display:flex;flex-direction:column;gap:16px;margin:25px 0 28px}.search{border:1px solid #cfded2;padding:15px 17px;border-radius:12px;background:#fff;max-width:600px;width:100%;outline-color:#83a998}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #d5e2d7;background:#fff;color:#4a6056;padding:8px 16px;border-radius:24px;font-size:13px;font-weight:750}.chip.selected{background:var(--forest);color:#fff;border-color:var(--forest)}.count{font-size:13px;color:#66756d;margin-bottom:20px}.detail{padding:55px 0 75px}.crumb{font-size:13px;color:var(--muted);margin-bottom:20px}.detailgrid{display:grid;grid-template-columns:minmax(280px,.9fr) 1fr;gap:44px;align-items:start}.player{aspect-ratio:9/14;background:#233d34;border-radius:19px;display:flex;justify-content:center;align-items:center;flex-direction:column;color:white;gap:12px;max-height:620px}.player button{border:none;background:#ffffff;color:#28594e;border-radius:50%;height:64px;width:64px;font-size:24px}.pill{display:inline-block;background:#e7efe5;color:#28594e;border-radius:30px;padding:4px 11px;font-size:12px;font-weight:750;margin-bottom:14px}.info{padding:22px;border:1px solid #e2e9df;border-radius:16px;margin-top:18px;background:#fff}.info h3{font-size:16px;margin-bottom:7px}.info p{margin:0;color:#5b6a62;font-size:14px}.detail h1{font-size:39px}.detail .lede{font-size:16px}.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed #d8e0d7;border-radius:15px}.notice{background:#fff9e9;border:1px solid #f3e5c3;padding:10px 15px;border-radius:11px;font-size:12px;color:#7c6236;margin:15px 0}.hide{display:none!important}:focus-visible{outline:3px solid #d7a05a!important;outline-offset:3px}@media(max-width:980px){.nav{gap:10px}.nav button{font-size:12px}.cards{grid-template-columns:repeat(3,1fr)}.topics{grid-template-columns:repeat(3,1fr)}.herogrid{gap:25px}}@media(max-width:760px){.container{padding:0 18px}.headinner{height:65px}.burger{display:block}.nav{display:none;position:absolute;top:65px;left:0;right:0;background:white;flex-direction:column;align-items:stretch;padding:20px 25px;box-shadow:0 14px 25px #183e3515}.nav.open{display:flex}.nav button{text-align:left;font-size:15px;padding:9px}.subscribe{display:none}.hero{padding:48px 0}.herogrid{grid-template-columns:1fr}.visual{min-height:240px}.illustration{width:48%}.section{padding:47px 0}.cards{grid-template-columns:repeat(2,1fr);gap:14px}.topics{grid-template-columns:repeat(3,1fr);gap:8px}.topic{padding:15px 6px;font-size:12px}.paths,.steps,.detailgrid{grid-template-columns:1fr}.pagehead{padding:40px 0 24px}.detail h1{font-size:30px}.player{max-width:380px;margin:auto}.footrow{flex-direction:column;align-items:start}.sectionhead{align-items:start}.sectionhead h2{font-size:26px}}@media(max-width:390px){.topics{grid-template-columns:repeat(2,1fr)}.cardtitle{font-size:14px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
</style></head><body><header class="header"><div class="container headinner"><a href="#home" class="brand" onclick="go('home');return false"><span class="brandmark">AB</span><span>Ayah Bercerita</span></a><nav id="nav" class="nav" aria-label="Navigasi utama"><button data-nav="home" onclick="go('home')">Beranda</button><button data-nav="catalog" onclick="go('catalog')">Jelajahi Video</button><button data-nav="child" onclick="go('child')">Cerita Anak</button><button data-nav="father" onclick="go('father')">Catatan Ayah</button><button data-nav="about" onclick="go('about')">Tentang</button></nav><button class="primary subscribe" onclick="alert('Placeholder: tautan channel YouTube akan dihubungkan setelah channel dibuat.')">YouTube ↗</button><button class="burger" id="burger" onclick="document.getElementById('nav').classList.toggle('open')" aria-label="Buka menu">☰</button></div></header>
<main id="app"></main><footer class="footer"><div class="container footrow"><div><div style="font-size:19px;font-weight:800">Ayah Bercerita</div><small>Cerita kecil. Ilmu baru. Kebersamaan yang bermakna.</small></div><small>Prototype desain · ayahbercerita.my.id · Data video contoh, bukan dari YouTube</small></div></footer>
<script>
const videos=[{id:'hujan',title:'Kenapa Hujan Turun?',aud:'Anak',topic:'Sains',dur:'0:59',desc:'Melihat bagaimana hujan terbentuk dan mengajak anak mengamati air di lingkungan sekitarnya.',bg:'#dceae6',kind:'rain'},{id:'izin',title:'Mengapa Kita Harus Meminta Izin?',aud:'Anak',topic:'Adab',dur:'0:59',desc:'Mengenal adab menjaga privasi dan menghormati ruang orang lain.',bg:'#f0e9d8',kind:'door'},{id:'bertanya',title:'Jangan Terlalu Cepat Memberi Jawaban',aud:'Ayah',topic:'Pengasuhan',dur:'1:15',desc:'Memberi ruang bagi rasa ingin tahu dan kemampuan berpikir anak.',bg:'#e0e7ec',kind:'cup'},{id:'es',title:'Kenapa Es Bisa Mencair?',aud:'Anak',topic:'Sains',dur:'0:59',desc:'Mengamati perubahan wujud melalui es dan air.',bg:'#e1eef0',kind:'ice'},{id:'jujur',title:'Mengapa Kita Perlu Jujur?',aud:'Anak',topic:'Adab',dur:'0:59',desc:'Mengenal kejujuran dalam kehidupan sehari-hari.',bg:'#e6eccc',kind:'leaf'},{id:'dengar',title:'Ayah, Dengarkan Dulu',aud:'Ayah',topic:'Komunikasi',dur:'1:09',desc:'Meluangkan perhatian dan mendengarkan cerita anak.',bg:'#ebded1',kind:'chair'},{id:'tumbuh',title:'Bagaimana Biji Bisa Tumbuh?',aud:'Anak',topic:'Sains',dur:'0:59',desc:'Mengikuti pertumbuhan biji dan akar.',bg:'#e1ead9',kind:'leaf'},{id:'tegas',title:'Tegas Tidak Harus Membentak',aud:'Ayah',topic:'Pengasuhan',dur:'1:12',desc:'Membangun batasan yang jelas dan penuh kasih.',bg:'#dce7e4',kind:'cup'}];
function art(kind){let core={rain:'<path d="M36 73 Q22 52 44 46 Q50 22 78 37 Q99 31 107 53 Q131 56 118 80 Z" fill="#fff"/><path d="M44 91l-7 15m32-15-7 15m32-15-7 15" stroke="#477c82" stroke-width="6" stroke-linecap="round"/>',door:'<rect x="35" y="23" width="84" height="116" rx="5" fill="#7d9f8a"/><rect x="47" y="34" width="61" height="100" rx="2" fill="#f8f4e9"/><circle cx="99" cy="88" r="5" fill="#d7a05a"/>',cup:'<rect x="34" y="58" width="78" height="65" rx="8" fill="#f4f1e8" stroke="#658578" stroke-width="5"/><path d="M112 69q33-3 20 23q-6 10-20 8" fill="none" stroke="#658578" stroke-width="6"/><path d="M50 49q-9-12 0-22m26 22q-9-12 0-22" fill="none" stroke="#d7a05a" stroke-width="5" stroke-linecap="round"/>',ice:'<path d="M30 52l42-17 39 20-3 56-38 24-39-24Z" fill="#c2dde1" stroke="#488e9c" stroke-width="4"/><path d="M30 52l40 23 41-20M70 75v60" fill="none" stroke="#488e9c" stroke-width="3"/>',leaf:'<path d="M76 124V61" stroke="#315d47" stroke-width="7" stroke-linecap="round"/><path d="M76 82C25 73 27 35 47 30c31-5 41 27 29 52M75 67c39-46 77-22 65 0-16 27-43 22-65 0" fill="#649779"/>',chair:'<rect x="41" y="40" width="68" height="65" rx="10" fill="#7da295"/><rect x="35" y="99" width="83" height="15" rx="5" fill="#526b63"/><path d="M44 114v26m66-26v26" stroke="#526b63" stroke-width="6"/>'}[kind];return `<svg viewBox="0 0 150 150" role="img" aria-label="Ilustrasi objek edukatif">${core}</svg>`}
function card(v){return `<button class="video-card" onclick="go('detail','${v.id}')"><div class="thumbnail" style="background:${v.bg}">${art(v.kind)}<span class="duration">${v.dur}</span><span class="play">▶</span></div><div class="cardtitle">${v.title}</div><div class="meta">${v.aud==='Anak'?'Cerita untuk Kita':'Catatan Ayah'} · ${v.topic}</div></button>`}
function grid(items){return items.length?`<div class="cards">${items.map(card).join('')}</div>`:'<div class="empty">Belum ada video dalam pilihan ini. Coba hapus filter pencarian.</div>'}
function hero(){return `<div class="hero"><div class="container herogrid"><div><div class="eyebrow">Rumah cerita keluarga</div><h1>Dari cerita kecil, tumbuh rasa ingin tahu.</h1><p class="lede">Mengenal Allah, memahami alam, belajar adab, dan bertumbuh bersama. Cerita singkat untuk anak dan catatan hangat bagi para ayah.</p><div class="actions"><button class="primary" onclick="go('catalog')">Jelajahi Cerita →</button><button class="secondary" onclick="go('father')">Untuk Para Ayah</button></div></div><div class="visual"><svg class="illustration" viewBox="0 0 290 270" aria-label="Ilustrasi tanaman tumbuh dari biji"><ellipse cx="145" cy="234" rx="125" ry="18" fill="#b8cbb1"/><rect x="75" y="152" width="140" height="80" rx="15" fill="#f7f4e7" stroke="#83a998" stroke-width="8"/><path d="M145 174V75" stroke="#28594e" stroke-width="11" stroke-linecap="round"/><path d="M145 116C70 119 63 56 93 47c36-10 53 29 52 69" fill="#83a998"/><path d="M144 98c3-56 64-67 83-40 18 31-40 65-83 40" fill="#28594e"/><circle cx="206" cy="41" r="22" fill="#d7a05a"/><path d="M109 188q36 14 71 0" stroke="#c7d5bf" stroke-width="6" fill="none"/></svg></div></div></div>`}
function home(){return `${hero()}<section class="section"><div class="container"><div class="sectionhead"><div><h2>Mulai dari rasa ingin tahu</h2><p>Pilih pertanyaan atau tema yang ingin dijelajahi bersama.</p></div></div><div class="topics">${[['✦','Tauhid'],['☁','Sains'],['♡','Adab'],['◈','Kisah'],['⚒','Aktivitas'],['◇','Sosial']].map(t=>`<button class="topic" onclick="go('catalog','','${t[1]}')"><span>${t[0]}</span>${t[1]}</button>`).join('')}</div></div></section><section class="section alt"><div class="container"><div class="sectionhead"><div><h2>Cerita terbaru</h2><p>Video singkat untuk ditonton, dibicarakan, lalu dicoba.</p></div><button class="textlink" onclick="go('catalog')">Lihat semua →</button></div>${grid(videos.slice(0,4))}</div></section><section class="section"><div class="container"><div class="sectionhead"><div><h2>Dua ruang, satu perjalanan</h2><p>Untuk anak yang ingin memahami dunia, dan ayah yang terus belajar mendampingi.</p></div></div><div class="paths"><div class="path"><div class="eyebrow">Untuk anak dan keluarga</div><h3 style="margin-top:12px">Cerita untuk Kita</h3><p>Pertanyaan kecil, kisah, sains, adab, dan aktivitas untuk dilakukan bersama.</p><a href="#child" onclick="go('child');return false">Lihat cerita anak →</a></div><div class="path ayah"><div class="eyebrow" style="color:#475e70">Untuk para ayah</div><h3 style="margin-top:12px">Catatan Ayah</h3><p>Refleksi, pemahaman perkembangan, dan praktik pengasuhan yang dekat dengan kehidupan.</p><a href="#father" onclick="go('father');return false">Lihat catatan ayah →</a></div></div></div></section><section class="section alt"><div class="container"><div class="sectionhead"><div><h2>Setelah menonton, lakukan bersama</h2><p>Tujuan kita bukan menambah waktu layar, tetapi membuka percakapan dan pengalaman nyata.</p></div></div><div class="steps"><div class="step"><div class="num">01 · AMATI</div><strong>Apa yang terlihat?</strong><p>Ajak anak mengamati benda atau peristiwa di sekitarnya.</p></div><div class="step"><div class="num">02 · BICARAKAN</div><strong>Mengapa bisa begitu?</strong><p>Dengarkan pertanyaan dan cara berpikir anak.</p></div><div class="step"><div class="num">03 · COBA</div><strong>Yuk, lakukan bersama.</strong><p>Pilih satu aktivitas sederhana yang aman dan bermakna.</p></div></div></div></section>`}
let selectedAudience='Semua',selectedTopic='Semua',query='';function toolbar(){return `<div class="toolbar"><input id="search" class="search" aria-label="Cari video" placeholder="Cari cerita atau topik..." value="${query.replaceAll('"','&quot;')}" oninput="query=this.value;refreshGrid()"><div class="chips">${['Semua','Anak','Ayah'].map(x=>`<button class="chip ${selectedAudience===x?'selected':''}" onclick="selectedAudience='${x}';renderCatalog()">${x==='Anak'?'Untuk Anak':x==='Ayah'?'Untuk Ayah':'Semua Video'}</button>`).join('')}</div><div class="chips">${['Semua','Tauhid','Sains','Adab','Kisah','Aktivitas','Pengasuhan','Komunikasi'].map(x=>`<button class="chip ${selectedTopic===x?'selected':''}" onclick="selectedTopic='${x}';renderCatalog()">${x}</button>`).join('')}</div></div>`}
function catalog(){return `<section class="pagehead"><div class="container"><div class="eyebrow">Perpustakaan Video</div><h1 style="font-size:43px;margin-bottom:10px">Jelajahi cerita</h1><p>Temukan kisah, pengetahuan, dan ide kegiatan untuk keluarga. Data pada prototype ini adalah ilustrasi.</p></div></section><section class="section" style="padding-top:25px"><div class="container"><div id="catalogbar"></div><div id="catalogresults"></div></div></section>`}
function filtered(){return videos.filter(v=>(selectedAudience==='Semua'||v.aud===selectedAudience)&&(selectedTopic==='Semua'||v.topic===selectedTopic)&&v.title.toLowerCase().includes(query.toLowerCase()))}function refreshGrid(){const a=filtered();document.getElementById('catalogresults').innerHTML=`<div class="count">${a.length} contoh video ditemukan</div>${grid(a)}`}function renderCatalog(){document.getElementById('catalogbar').innerHTML=toolbar();refreshGrid()}
function audiencePage(aud){let child=aud==='Anak';let list=videos.filter(x=>x.aud===aud);return `<section class="pagehead"><div class="container"><div class="eyebrow">${child?'Cerita untuk Kita':'Catatan Ayah'}</div><h1 style="font-size:43px">${child?'Setiap pertanyaan punya cerita.':'Menjadi ayah adalah perjalanan belajar.'}</h1><p>${child?'Kumpulan cerita yang mengajak anak mengenal, mengamati, bertanya, dan mencoba bersama keluarga.':'Refleksi singkat tentang kehadiran ayah, komunikasi, emosi, dan pendidikan keluarga.'}</p><button class="secondary" onclick="go('catalog')">Jelajahi semua video →</button></div></section><section class="section"><div class="container"><div class="sectionhead"><div><h2>${child?'Cerita pilihan untuk anak':'Refleksi pilihan untuk ayah'}</h2><p>Konten contoh untuk melihat rancangan katalog.</p></div></div>${grid(list)}</div></section>`}
function detail(id){const v=videos.find(x=>x.id===id)||videos[0];return `<section class="detail"><div class="container"><div class="crumb">Beranda / ${v.aud==='Anak'?'Cerita Anak':'Catatan Ayah'} / ${v.topic}</div><div class="detailgrid"><div><div class="player"><div style="width:150px">${art(v.kind)}</div><button onclick="alert('Prototype: video YouTube sebenarnya akan dimuat di sini setelah channel resmi dihubungkan.')" aria-label="Putar video">▶</button><div style="font-size:13px">Preview pemutar YouTube · ${v.dur}</div></div></div><div><span class="pill">${v.aud==='Anak'?'Cerita untuk Kita':'Catatan Ayah'} · ${v.topic}</span><h1>${v.title}</h1><p class="lede">${v.desc}</p><div class="notice">Konten ini adalah contoh layout, bukan metadata video YouTube asli.</div><div class="info"><h3>Ringkasan</h3><p>${v.desc}</p></div><div class="info"><h3>${v.aud==='Anak'?'Ajak anak berbincang':'Renungan untuk ayah'}</h3><p>${v.aud==='Anak'?'Apa yang kamu perhatikan dari cerita ini? Coba ceritakan dengan kata-katamu sendiri.':'Apa satu tindakan kecil yang bisa Ayah coba hari ini?'}</p></div><div class="info"><h3>${v.aud==='Anak'?'Lanjutkan menjadi kegiatan':'Langkah kecil untuk dipraktikkan'}</h3><p>${v.aud==='Anak'?'Lakukan pengamatan atau kegiatan sederhana bersama orang tua dengan pengawasan yang sesuai.':'Pilih satu perubahan komunikasi yang realistis dan praktikkan tanpa menuntut hasil instan.'}</p></div><div class="actions"><button class="primary" onclick="alert('Tautan YouTube asli tersedia setelah integrasi channel.')">Tonton di YouTube ↗</button><button class="secondary" onclick="go('catalog')">Video lainnya</button></div></div></div></div></section><section class="section alt"><div class="container"><div class="sectionhead"><h2>Jelajahi cerita lainnya</h2></div>${grid(videos.filter(x=>x.id!==v.id).slice(0,4))}</div></section>`}
function about(){return `<section class="pagehead"><div class="container"><div class="eyebrow">Tentang kami</div><h1 style="font-size:44px">Cerita yang mempertemukan ilmu dan kebersamaan.</h1><p>Ayah Bercerita menghadirkan animasi edukatif singkat untuk anak dan refleksi praktis bagi ayah. Video adalah awal percakapan, bukan tujuan akhir pembelajaran.</p></div></section><section class="section"><div class="container"><div class="steps"><div class="step"><div class="num">NILAI 01</div><strong>Ilmu yang dapat dipertanggungjawabkan</strong><p>Materi agama dan sains diperiksa secara editorial.</p></div><div class="step"><div class="num">NILAI 02</div><strong>Anak yang aktif berpikir</strong><p>Belajar melalui observasi, pertanyaan, dan aktivitas sederhana.</p></div><div class="step"><div class="num">NILAI 03</div><strong>Ayah yang bertumbuh</strong><p>Refleksi pengasuhan yang hangat, jelas, dan aplikatif.</p></div></div></div></section>`}
function go(view,id='',topic=''){document.getElementById('nav').classList.remove('open');document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));if(topic){selectedTopic=topic;selectedAudience='Semua';query=''}const views={home:home,catalog:catalog,child:()=>audiencePage('Anak'),father:()=>audiencePage('Ayah'),about};document.getElementById('app').innerHTML=view==='detail'?detail(id):(views[view]||home)();if(view==='catalog')renderCatalog();window.scrollTo({top:0,behavior:'instant'})}go('home');
</script></body></html>
